<script>
try {
 const connection = navigator.connection;
 const replay = new URLSearchParams(location.search).get('intro') === '1';
 if (location.pathname === '/' && (!location.hash || replay) && (replay || !sessionStorage.getItem('wnw_intro_seen')) && !matchMedia('(prefers-reduced-motion: reduce)').matches && !(connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType || '')))) {
  document.documentElement.classList.add('intro-on');
  window.wnwIntroWatchdog = setTimeout(() => document.documentElement.classList.remove('intro-on'), 3500);
 }
} catch { /* The homepage remains usable when storage is unavailable. */ }
</script>
